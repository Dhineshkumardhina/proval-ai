name: PropVal AI Production CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Stage 1: Security & Secret Scanning Gate
  # =========================================================================
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # =========================================================================
  # Stage 2: Frontend Validation & Production Bundle
  # =========================================================================
  frontend-gate:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit NPM Dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Static TypeScript Validation
        run: npx tsc --noEmit

      - name: Run Frontend Unit Tests
        run: npm test -- --run

      - name: Production Vite Build
        run: npm run build

  # =========================================================================
  # Stage 3: Backend Testing, Security & Migration Integrity
  # =========================================================================
  backend-gate:
    name: Backend Test, Alembic Sync & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary bandit pip-audit

      - name: Static Security Scan (Bandit)
        run: bandit -r backend/app -ll -x backend/tests

      - name: Python Dependency Vulnerability Audit
        run: pip-audit -r backend/requirements.txt --ignore-vuln GHSA-XXXX-XXXX
        continue-on-error: true

      - name: Validate Alembic Schema Consistency
        env:
          PYTHONPATH: backend
        run: |
          python -m alembic -c backend/alembic.ini check

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests -v --maxfail=1

  # =========================================================================
  # Stage 4: Container Multi-Stage Build & Trivy Vulnerability Scan
  # =========================================================================
  container-build-scan:
    name: Docker Multi-Stage Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [frontend-gate, backend-gate, secret-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: propval-backend:latest
          load: true

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: propval-frontend:latest
          load: true

      - name: Run Trivy Vulnerability Scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'propval-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # Stage 5: Production Deployment with Manual Approval Gate
  # =========================================================================
  deploy-production:
    name: Production Deployment (Approval Gated)
    runs-on: ubuntu-latest
    needs: [container-build-scan]
    if: github.ref == 'refs/heads/production' || github.event.inputs.target_env == 'production'
    environment:
      name: production
      url: https://propval.example.com
    steps:
      - name: Deploy to Production Host / Orchestrator
        run: |
          echo "Executing production deployment orchestration..."
          echo "Pre-flight: Verifying database migrations..."
          echo "Deploying zero-downtime rolling update via Docker Compose / Kubernetes..."
          echo "Post-flight: Health check probe against https://api.propval.example.com/health/ready..."

