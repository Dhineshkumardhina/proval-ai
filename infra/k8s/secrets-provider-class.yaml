apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: propval-aws-secrets
  namespace: propval-production
  labels:
    app.kubernetes.io/name: propval-ai
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "propval/production/app-secrets"
        objectType: "secretsmanager"
        jmesPath: 
          - path: "JWT_SECRET"
            objectAlias: "JWT_SECRET"
          - path: "DATABASE_URL"
            objectAlias: "DATABASE_URL"
          - path: "GEMINI_API_KEY"
            objectAlias: "GEMINI_API_KEY"
  secretObjects:
    - secretName: propval-secrets
      type: Opaque
      data:
        - objectName: "JWT_SECRET"
          key: "JWT_SECRET"
        - objectName: "DATABASE_URL"
          key: "DATABASE_URL"
        - objectName: "GEMINI_API_KEY"
          key: "GEMINI_API_KEY"

