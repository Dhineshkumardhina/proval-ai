apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: propval-network-isolation
  namespace: propval-production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress controller to frontend
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Allow frontend pods to communicate with backend pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow backend pods to communicate with managed RDS PostgreSQL (port 5432)
    - to:
        - ipBlock:
            cidr: 10.0.50.0/24
        - ipBlock:
            cidr: 10.0.60.0/24
        - ipBlock:
            cidr: 10.0.70.0/24
      ports:
        - protocol: TCP
          port: 5432
    # Allow CoreDNS queries
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

