apiVersion: v1
kind: Service
metadata:
  name: propval-frontend-service
  namespace: propval-production
  labels:
    app.kubernetes.io/name: propval-ai
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: propval-ai
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: propval-ingress
  namespace: propval-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
    - hosts:
        - propval.institutional-pilot.bank.internal
      secretName: propval-tls-cert
  rules:
    - host: propval.institutional-pilot.bank.internal
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: propval-backend-service
                port:
                  number: 8000
          - path: /health/
            pathType: Prefix
            backend:
              service:
                name: propval-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: propval-frontend-service
                port:
                  number: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: propval-db-migration
  namespace: propval-production
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: alembic-migration
          image: propval-backend:production-latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: propval-secrets

